<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉庫現況 3D 模型</title>
<style>
:root{color-scheme:light;--ink:#27332e;--muted:#5b675f;--page:#f7f6f1;--line:#dce0d8;--green:#285a49;--rust:#a45449}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{width:min(1440px,100% - 48px);margin:auto;padding:30px 0 24px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.18;margin:0 0 7px;letter-spacing:.025em} p{margin:0}
.meta,.hint,.note{color:var(--muted);font-size:13px}.meta{font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:16px}
.viewer{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 4px 20px #213a2910}
.controls{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;min-height:40px;padding:6px 12px;touch-action:manipulation}
button:hover{background:#eef4ed}button[aria-pressed="true"]{background:var(--green);color:white;border-color:var(--green)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #659d89;outline-offset:2px}
#reset{margin-left:auto}
.stage{position:relative;height:clamp(340px,59vh,720px);background:linear-gradient(#dce9e6,#eff0e9);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.walk #scene{cursor:move}.stage-label{position:absolute;top:13px;left:13px;border:1px solid #ffffffa0;background:#fbfdf4e8;padding:5px 9px;border-radius:6px;font-size:12px;pointer-events:none}
#warning{position:absolute;top:40%;left:10%;right:10%;text-align:center}
.zoom,.pad{position:absolute;bottom:14px;display:flex;gap:5px}.zoom{right:14px}
.zoom button,.pad button{background:#fffef2ed;font-size:19px;padding:0;width:42px;height:42px;text-align:center;touch-action:none}.pad{left:14px}
aside{border:1px solid var(--line);border-radius:15px;background:#fff;padding:15px 16px;align-self:start}
h2{font-size:17px;margin:0 0 12px}
.metrics{margin:0 0 11px}.metrics div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e9ece6}
dt{font-weight:530} dd{margin:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.area{color:var(--muted);font-size:13px;margin-bottom:7px}
.measure-note{margin-bottom:13px}
details{border-top:1px solid var(--line);padding:12px 0}summary{font-weight:600;cursor:pointer}
form{display:grid;gap:7px;margin-top:10px}label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
input{max-width:78px;width:100%;padding:4px 6px;color:var(--ink);border:1px solid #c8d1c8;border-radius:5px;font:inherit}
#report{color:var(--rust);font-size:12px}.save{margin-top:2px;width:100%}
.hint{min-height:43px;padding:11px 13px;background:#fff;border-top:1px solid var(--line)}
[hidden]{display:none!important}
@media(max-width:800px){main{width:calc(100% - 24px);padding-top:19px}header{margin-bottom:13px}.layout{grid-template-columns:1fr;gap:12px}.stage{height:clamp(300px,54vh,600px)}.metrics{display:grid;grid-template-columns:1fr 1fr;column-gap:17px}}
@media(max-width:410px){button{padding-inline:8px}.controls{gap:4px;padding:7px}.metrics{grid-template-columns:1fr}.stage{min-height:285px}}
html[data-embedded] main{padding-top:18px}
html[data-embedded] .stage{height:clamp(325px,42vw,585px)}
</style>
</head>
<body>
<main>
  <header><div><h1>倉庫現況 3D 模型</h1><p class="meta">依現場照片重建的比例草模</p></div></header>
  <div class="layout">
    <section class="viewer" aria-label="倉庫模型檢視器">
      <nav class="controls" aria-label="模型視角">
        <button data-view="orbit" aria-pressed="true">外觀旋轉</button>
        <button data-view="front" aria-pressed="false">正面</button>
        <button data-view="cut" aria-pressed="false">俯看室內</button>
        <button data-view="walk" aria-pressed="false">室內走動</button>
        <button id="reset">重設視角</button>
      </nav>
      <div class="stage">
        <canvas id="scene" tabindex="0" aria-label="互動倉庫 3D 模型"></canvas>
        <span class="stage-label" id="viewName">外觀 · 正面左側</span>
        <p id="warning" hidden>瀏覽器無法繪製 3D 模型，請以支援 WebGL 2 的瀏覽器開啟。</p>
        <div class="zoom" id="zoom"><button type="button" data-zoom="in" aria-label="放大">＋</button><button type="button" data-zoom="out" aria-label="縮小">−</button></div>
        <div class="pad" id="pad" hidden aria-label="室內方向控制">
          <button type="button" data-move="a" aria-label="向左平移">←</button>
          <button type="button" data-move="w" aria-label="向前走">↑</button>
          <button type="button" data-move="s" aria-label="向後走">↓</button>
          <button type="button" data-move="d" aria-label="向右平移">→</button>
        </div>
      </div>
      <p class="hint" id="hint">拖曳旋轉 · 滾輪或右下角按鈕縮放</p>
    </section>
    <aside aria-label="模型尺寸">
      <h2>照片估算尺寸</h2>
      <dl class="metrics">
        <div><dt>正面寬</dt><dd data-value="width"></dd></div>
        <div><dt>前後深</dt><dd data-value="depth"></dd></div>
        <div><dt>地面至前簷</dt><dd data-value="eave"></dd></div>
        <div><dt>地面至屋脊</dt><dd data-value="ridge"></dd></div>
        <div><dt>前簷外伸</dt><dd data-value="awning"></dd></div>
        <div><dt>捲門淨寬 × 高</dt><dd data-value="roller"></dd></div>
      </dl>
      <p class="area" id="area"></p>
      <p class="note measure-note">進深、前簷外伸及後牆窗位待核對。</p>
      <details>
        <summary>輸入實測尺寸</summary>
        <form id="measure">
          <label>正面寬（m）<input name="width" type="number" step="0.01" min="2" max="100" required></label>
          <label>前後深（m）<input name="depth" type="number" step="0.01" min="2" max="100" required></label>
          <label>地面至前簷（m）<input name="eave" type="number" step="0.01" min="2" max="20" required></label>
          <label>地面至屋脊（m）<input name="ridge" type="number" step="0.01" min="2.1" max="25" required></label>
          <label>前簷外伸（m）<input name="awning" type="number" step="0.01" min="0" max="10" required></label>
          <button>套用到模型</button><p id="report" role="status"></p>
        </form>
      </details>
      <button class="save" id="export">匯出 GLB 模型</button>
    </aside>
  </div>
</main>
<script>
'use strict';
const initial = {width:14.8, depth:6.2, eave:3.2, ridge:3.9, awning:1.3};
let dims = {...initial};
const $ = id => document.getElementById(id);
const canvas = $('scene');
const gl = canvas.getContext('webgl2', {antialias:true, alpha:true, premultipliedAlpha:false});
const palettes = {
  cladding:[0.77,0.79,0.80], rib:[0.82,0.84,0.85], wallBase:[0.65,0.67,0.68],
  roof:[0.63,0.30,0.29], roofRib:[0.71,0.38,0.36], lining:[0.82,0.79,0.69],
  steel:[0.41,0.46,0.44], steelLight:[0.51,0.55,0.52], canopy:[0.79,0.79,0.73],
  door:[0.14,0.23,0.37], doorFrame:[0.11,0.17,0.27], trim:[0.34,0.36,0.38],
  window:[0.57,0.69,0.65], windowTrim:[0.31,0.33,0.35],
  shutter:[0.29,0.51,0.63], shutterRib:[0.36,0.58,0.69],
  concrete:[0.72,0.70,0.64], apron:[0.76,0.74,0.67], lamp:[0.92,0.90,0.79],
  dark:[0.28,0.34,0.32], paved:[0.60,0.62,0.58]
};
const sub = (a,b) => a.map((v,i)=>v-b[i]);
const add = (a,b) => a.map((v,i)=>v+b[i]);
const mul = (a,k) => a.map(v=>v*k);
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const unit = a => mul(a,1/(Math.hypot(...a)||1));
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const mix = (a,b,t) => a+(b-a)*t;

function buildModel({width:w,depth:d,eave:h,ridge:r,awning:a}) {
  const groups = {site:[], shell:[], roof:[], awning:[]};
  let part = 'site';
  function tri(p,q,s,tone) {
    const normal=unit(cross(sub(q,p),sub(s,p)));
    const color=palettes[tone];
    const vertices=groups[part];
    vertices.push(...p,...normal,...color,...q,...normal,...color,...s,...normal,...color);
  }
  function quad(p,q,r,s,tone) {
    tri(p,q,r,tone);
    tri(p,r,s,tone);
  }
  function solid(v,tone) {
    for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]) {
      quad(...f.map(i=>v[i]),tone);
    }
  }
  function box(x0,y0,z0,x1,y1,z1,tone) {
    if(x0>=x1||y0>=y1||z0>=z1) return;
    solid([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
      [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],tone);
  }
  function slopedBox(x0,x1,y0,y1,z0,z1,thickness,tone) {
    solid([[x0,y0,z0-thickness],[x1,y0,z0-thickness],[x1,y1,z1-thickness],[x0,y1,z1-thickness],
      [x0,y0,z0],[x1,y0,z0],[x1,y1,z1],[x0,y1,z1]],tone);
  }
  const X = n => n*w/14.8;
  const Y = n => n*d/6.2;
  const Z = n => n*h/3.2;
  const cutoff = Z(.91);
  const roller = {u:X(5.13), v:X(9.78), z:0, t:Z(2.86), type:'roller'};
  const door = {u:X(9.99), v:X(10.89), z:0, t:Z(2.05), type:'door'};
  const win = (u,v,head=1.84) => ({u,v,z:Z(.96),t:Z(head),type:'window'});
  const front = [win(X(1.92),X(3.37),1.81),roller,door,win(X(11.75),X(13.19))];
  const rear = [2.49,7.48,12.47].map(x=>win(X(x-.74),X(x+.74)));
  const side = [1.55,4.66].map(y=>win(Y(y-.72),Y(y+.72)));
  box(-.98,-Math.max(2.2,a+.74),-.17,w+.98,d+.85,-.075,'paved');
  box(-.32,-Math.max(1.53,a+.12),-.095,w+.32,d+.28,-.022,'apron');

  part = 'shell';
  box(0,0,-.06,w,d,0,'concrete');
  function wall(length,opening,axis,place,outside) {
    const slab = (u,v,z,t,n0,n1,tone) => {
      const low=Math.min(place+n0*outside,place+n1*outside);
      const high=Math.max(place+n0*outside,place+n1*outside);
      if(axis==='x') box(u,low,z,v,high,t,tone);
      else box(low,u,z,high,v,t,tone);
    };
    function panel(u,v,z,t) {
      slab(u,v,z,Math.min(t,cutoff),-.09,.025,'wallBase');
      slab(u,v,Math.max(z,cutoff),t,-.053,.018,'cladding');
      slab(u,v,Math.max(z,cutoff-.012),Math.min(t,cutoff+.014),.017,.032,'trim');
    }
    let cursor=0;
    for(const o of opening) {
      panel(cursor,o.u,0,h-.08);
      panel(o.u,o.v,0,o.z);
      panel(o.u,o.v,o.t,h-.08);
      cursor=o.v;
    }
    panel(cursor,length,0,h-.08);

    for(let u=.045;u<length-.025;u+=.126) {
      const o=opening.find(f=>f.u<=u+.014&&f.v>=u-.014);
      const rib=(z,t)=>{
        slab(u-.013,u+.013,z,t,.016,.037,'rib');
        slab(u-.009,u+.009,z,t,-.065,-.052,'rib');
      };
      rib(cutoff+.018,o ? o.z : h-.08);
      if(o) rib(Math.max(cutoff+.018,o.t),h-.08);
    }
    for(const {u,v,z,t,type} of opening) {
      if(type==='roller') {
        slab(u,v,.012,t,-.043,.02,'shutter');
        for(let level=.028;level<t-.026;level+=.069) {
          slab(u+.026,v-.026,level,level+.022,.019,.047,'shutterRib');
          slab(u+.026,v-.026,level,level+.022,-.055,-.041,'shutterRib');
        }
        slab(u-.065,u+.024,0,t+.055,-.067,.06,'shutter');
        slab(v-.024,v+.065,0,t+.055,-.067,.06,'shutter');
        slab(u-.054,v+.054,t-.012,t+.047,-.067,.046,'shutter');
        slab(u-.065,v+.065,t+.015,t+Z(.198),-.27,-.043,'shutter');
      } else {
        const isDoor=type==='door';
        const frame=isDoor?.055:.052;
        const finish=isDoor?'doorFrame':'trim';
        slab(u+frame,v-frame,z+frame,t-frame,-.027,.009,isDoor?'door':'window');
        slab(u,u+frame,z,t,-.078,.051,finish);
        slab(v-frame,v,z,t,-.078,.051,finish);
        slab(u,v,z,z+frame,-.090,.068,finish);
        slab(u,v,t-frame,t,-.080,.051,finish);
        const middle=(u+v)/2;
        if(isDoor) {
          const inner=u+(v-u)*.23, outer=v-(v-u)*.23;
          slab(inner,outer,Z(.72),Z(1.68),.009,.019,'windowTrim');
          slab(inner+.035,outer-.035,Z(.76),Z(1.64),.018,.024,'window');
          slab(u+.105,u+.19,Z(.98),Z(1.03),.013,.05,'dark');
          slab(inner,inner+.025,Z(.74),Z(1.66),.029,.043,'steelLight');
          slab(outer-.025,outer,Z(.74),Z(1.66),.029,.043,'steelLight');
          for(let level=Z(.78);level<Z(1.63);level+=.09) slab(inner,outer,level,level+.012,.026,.043,'steelLight');
        } else {
          slab(middle-.021,middle+.021,z+frame,t-frame,-.041,.022,'windowTrim');
          for(let pos=u+frame+.045;pos<v-frame;pos+=.112) slab(pos,pos+.014,z+frame,t-frame,.018,.044,'steelLight');
          slab(u+frame,v-frame,mix(z,t,.51),mix(z,t,.51)+.017,.02,.047,'steelLight');
          slab(u-.072,v+.072,t-.005,t+.047,.028,.235,'trim');
        }
      }
    }
  }
  wall(w,front,'x',0,-1);
  wall(w,rear,'x',d,1);
  wall(d,side,'y',0,-1);
  wall(d,side,'y',w,1);

  const roofZ = y => r-(r-h)*Math.abs((y-d/2)/(d/2));
  for(const end of [0,w]) {
    const outer=end===0?-.012:w+.012;
    const inner=end===0?.035:w-.035;
    const p=[outer,0,h-.085], q=[outer,d,h-.085], tip=[outer,d/2,r-.06];
    if(end===0) tri(p,tip,q,'cladding');
    else tri(p,q,tip,'cladding');
    const facing=[inner,0,h-.085], back=[inner,d,h-.085], top=[inner,d/2,r-.06];
    if(end===0) tri(facing,back,top,'cladding');
    else tri(facing,top,back,'cladding');
    for(let y=.065;y<d-.063;y+=.126) {
      box(outer-.015,y-.011,h-.095,outer+.015,y+.011,roofZ(y)-.06,'rib');
    }
  }
  for(const x of [.085,roller.u-.07,roller.v+.07,w-.085]) {
    box(x-.073,.022,.005,x+.073,.171,h-.06,'steel');
    box(x-.073,d-.171,.005,x+.073,d-.022,h-.06,'steel');
    slopedBox(x-.082,x+.082,.11,d/2,h-.05,r-.07,.143,'steel');
    slopedBox(x-.082,x+.082,d/2,d-.11,r-.07,h-.05,.143,'steel');
    if(x>.25&&x<w-.25) {
      const y0=d*.22,y1=d*.78;
      box(x-.077,y0,roofZ(y0)-.257,x+.077,y1,roofZ(y0)-.123,'steel');
    } else {
      box(x-.07,d/2-.064,.008,x+.07,d/2+.064,r-.14,'steel');
    }
  }
  const girt=Z(2.03);
  for(const z of [cutoff-.016,girt,h-.20]) {
    // Split the front rails at the two door openings.
    let start=.02;
    for(const o of [roller,door].filter(o=>o.t>z)) {
      box(start,.038,z,o.u,.095,z+.055,'steelLight');
      start=o.v;
    }
    box(start,.038,z,w-.02,.095,z+.055,'steelLight');
    box(.02,d-.097,z,w-.02,d-.041,z+.055,'steelLight');
    box(.041,.04,z,.099,d-.035,z+.055,'steelLight');
    box(w-.099,.04,z,w-.041,d-.035,z+.055,'steelLight');
  }
  for(let i=0;i<=10;i++) {
    const y=mix(.09,d-.09,i/10), z=roofZ(y)-.037;
    box(.025,y-.035,z-.065,w-.025,y+.035,z,'steel');
  }
  for(const x of [X(2.8),X(7.35),X(12.1)]) {
    box(x-.57,d/2-.045,r-.232,x+.57,d/2+.045,r-.162,'steelLight');
    box(x-.54,d/2-.037,r-.246,x+.54,d/2+.037,r-.228,'lamp');
  }

  part='roof';
  for(const [y0,y1] of [[-.08,d/2],[d/2,d+.16]]) {
    slopedBox(-.15,w+.15,y0,y1,roofZ(y0),roofZ(y1),.048,'lining');
    slopedBox(-.15,w+.15,y0,y1,roofZ(y0)+.024,roofZ(y1)+.024,.026,'roof');
    for(let x=-.128;x<w+.13;x+=.143) {
      slopedBox(x,x+.022,y0,y1,roofZ(y0)+.048,roofZ(y1)+.048,.027,'roofRib');
    }
  }
  slopedBox(-.17,w+.17,d/2-.12,d/2+.12,r+.056,r+.056,.025,'roof');
  for(const x of [-.15,w+.15]) {
    slopedBox(x-.022,x+.022,-.08,d/2,roofZ(-.08)+.047,r+.047,.125,'roof');
    slopedBox(x-.022,x+.022,d/2,d+.16,r+.047,roofZ(d+.16)+.047,.125,'roof');
  }

  part='awning';
  if(a>0) {
    slopedBox(-.13,w+.13,-a,0,h-.091,h+.003,.075,'canopy');
    slopedBox(-.13,w+.13,-a,0,h-.071,h+.024,.023,'roof');
    for(let x=-.115;x<w+.135;x+=.143) slopedBox(x,x+.023,-a,0,h-.049,h+.045,.025,'roofRib');
    for(const x of [.075,roller.u-.065,roller.v+.065,w-.075]) {
      slopedBox(x-.058,x+.058,-a+.03,.015,h-.164,h-.07,.15,'steel');
    }
    for(const fraction of [.03,.32,.65,.96]) {
      const y=-a*fraction,z=h-.089-.082*fraction;
      box(-.12,y-.037,z-.048,w+.12,y+.03,z,'steel');
    }
    box(-.165,-a-.07,h-.21,w+.165,-a+.006,h-.047,'steelLight');
    box(w/2-.57,-a*.68-.047,h-.187,w/2+.57,-a*.68+.047,h-.15,'steelLight');
    box(w/2-.542,-a*.68-.031,h-.207,w/2+.542,-a*.68+.031,h-.181,'lamp');
  }
  return Object.fromEntries(Object.entries(groups).map(([key,v])=>[key,new Float32Array(v)]));
}
const views = {
  orbit:['外觀 · 正面左側','拖曳旋轉 · 滾輪或右下角按鈕縮放'],
  front:['正面 · 站在室外朝倉庫看','由左至右為窗、藍色捲門、人行門、窗'],
  cut:['俯看室內 · 隱藏屋面','拖曳查看四面牆、鋼柱與屋架 · 滾輪縮放'],
  walk:['室內走動 · 眼高約 1.6 公尺','拖曳轉頭 · 用畫面方向鍵或鍵盤方向鍵／WASD 移動']
};
let mode='orbit', yaw=0, tilt=0, zoom=1, eye=[0,0,0], heading=0, pitch=0;
let pending=false, drag=null, lastTick=0, moveRequest=null;
const inputKeys=new Set(), pointerKeys=new Map();
let meshData, gpu=[];
function compile(type,source) {
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
  return shader;
}
function programForView() {
  const vert=compile(gl.VERTEX_SHADER,`#version 300 es
    layout(location=0) in vec3 position;
    layout(location=1) in vec3 normal;
    layout(location=2) in vec3 color;
    uniform vec3 eye, right, up, forward;
    uniform vec2 lens;
    out vec3 shade;
    out vec3 world;
    void main(){
      vec3 delta=position-eye;
      float depth=dot(delta,forward);
      gl_Position=vec4(dot(delta,right)*lens.x,dot(delta,up)*lens.y,depth*1.0004-0.056,depth);
      vec3 sun=normalize(vec3(-0.48,-0.65,0.66));
      float lighting=.71+.27*max(dot(sun,normal),0.)+.10*max(normal.z,0.);
      shade=color*lighting;
      world=position;
    }`);
  const frag=compile(gl.FRAGMENT_SHADER,`#version 300 es
    precision highp float;
    in vec3 shade;
    in vec3 world;
    out vec4 pixel;
    void main(){
      float grain=fract(sin(dot(floor(world*88.),vec3(127.1,311.7,74.7)))*43758.5453);
      pixel=vec4(shade+(grain-.5)*.021,1.);
    }`);
  const p=gl.createProgram();
  gl.attachShader(p,vert);
  gl.attachShader(p,frag);
  gl.linkProgram(p);
  gl.deleteShader(vert);
  gl.deleteShader(frag);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p));
  return p;
}
let program, uniforms;
function uploadGeometry() {
  meshData=buildModel(dims);
  if(!program) return;
  for(const item of gpu){
    gl.deleteVertexArray(item.vao);
    gl.deleteBuffer(item.buffer);
  }
  gpu=Object.entries(meshData).map(([kind,vertices])=>{
    const vao=gl.createVertexArray();
    const buffer=gl.createBuffer();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
    for(let i=0;i<3;i++){
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,12*i);
    }
    return {kind,vao,buffer,count:vertices.length/9};
  });
  gl.bindVertexArray(null);
}
function camera(aspect){
  const {width,depth,ridge,awning}=dims;
  if(mode==='walk'){
    const forward=[Math.sin(heading)*Math.cos(pitch),Math.cos(heading)*Math.cos(pitch),Math.sin(pitch)];
    return {from:eye,forward,scale:1.48*Math.min(1,aspect/1.05)};
  }
  const center=[width/2,(depth-awning)/2,ridge*(mode==='cut'?.15:.27)];
  const radius=Math.max(width*.93,depth*1.38,ridge*2.3)*zoom*Math.max(1,1.35/aspect);
  const from=add(center,[radius*Math.sin(yaw)*Math.cos(tilt),-radius*Math.cos(yaw)*Math.cos(tilt),radius*Math.sin(tilt)]);
  return {from,forward:unit(sub(center,from)),scale:2.02};
}
function draw(){
  if(!program) return;
  const density=Math.min(devicePixelRatio||1,2);
  const width=Math.max(1,Math.round(canvas.clientWidth*density));
  const height=Math.max(1,Math.round(canvas.clientHeight*density));
  if(canvas.width!==width||canvas.height!==height){
    canvas.width=width;
    canvas.height=height;
  }
  gl.viewport(0,0,width,height);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(program);
  const c=camera(width/height);
  const right=unit(cross(c.forward,[0,0,1]));
  const up=cross(right,c.forward);
  gl.uniform3fv(uniforms.eye,c.from);
  gl.uniform3fv(uniforms.forward,c.forward);
  gl.uniform3fv(uniforms.right,right);
  gl.uniform3fv(uniforms.up,up);
  gl.uniform2f(uniforms.lens,c.scale*height/width,c.scale);
  for(const item of gpu){
    if(mode==='cut'&&(item.kind==='roof'||item.kind==='awning')) continue;
    gl.bindVertexArray(item.vao);
    gl.drawArrays(gl.TRIANGLES,0,item.count);
  }
}
function requestDraw() {
  if(pending) return;
  pending=true;
  requestAnimationFrame(()=>{pending=false;draw();});
}
function clearMovement() {
  inputKeys.clear();
  pointerKeys.clear();
  lastTick=0;
  if(moveRequest!==null) cancelAnimationFrame(moveRequest);
  moveRequest=null;
}
function setMode(view){
  mode=view;
  clearMovement();
  zoom=1;
  const orbitSettings={orbit:[-.46,.36],front:[0,.10],cut:[-.42,1.03]};
  [yaw,tilt]=orbitSettings[mode]??[0,0];
  eye=[dims.width*.53,Math.min(.9,dims.depth*.2),1.6];
  heading=0;
  pitch=.10;
  for(const node of document.querySelectorAll('[data-view]')) node.setAttribute('aria-pressed',node.dataset.view===mode);
  $('viewName').textContent=views[mode][0];
  $('hint').textContent=views[mode][1];
  $('pad').hidden=mode!=='walk';
  $('zoom').hidden=mode==='walk';
  canvas.parentNode.classList.toggle('walk',mode==='walk');
  requestDraw();
}
function updateMeasurements(){
  const label = value => value.toFixed(2).replace(/0$/,'').replace(/\.0$/,'')+' m';
  for(const [key,val] of Object.entries(dims)){
    document.querySelector('[data-value='+key+']').textContent=label(val);
    $('measure').elements[key].value=val;
  }
  document.querySelector('[data-value=roller]').textContent=label(4.65*dims.width/14.8)+' × '+label(2.86*dims.eave/3.2);
  const area=dims.width*dims.depth;
  $('area').textContent='本體占地約 '+Math.round(area)+' m²（'+Math.round(area/3.3058)+' 坪）';
}
const directions={ArrowUp:'w',ArrowDown:'s',ArrowRight:'d',ArrowLeft:'a',w:'w',s:'s',a:'a',d:'d'};
function moveFrame(now){
  moveRequest=null;
  if(mode!=='walk'||(!inputKeys.size&&!pointerKeys.size)){
    lastTick=0;
    return;
  }
  const pressed=new Set([...inputKeys,...pointerKeys.values()]);
  const forward=Number(pressed.has('w'))-Number(pressed.has('s'));
  const right=Number(pressed.has('d'))-Number(pressed.has('a'));
  const delta=lastTick ? Math.min(.04,(now-lastTick)/1000) : .020;
  const amount=delta*2.05/(Math.hypot(forward,right)||1);
  eye[0]=clamp(eye[0]+amount*(Math.sin(heading)*forward+Math.cos(heading)*right),.34,dims.width-.34);
  eye[1]=clamp(eye[1]+amount*(Math.cos(heading)*forward-Math.sin(heading)*right),.34,dims.depth-.34);
  draw();
  lastTick=now;
  scheduleMovement();
}
function scheduleMovement(){
  if(moveRequest===null) moveRequest=requestAnimationFrame(moveFrame);
}
document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  setMode(btn.dataset.view);
  if(mode==='walk') canvas.focus({preventScroll:true});
}));
$('reset').addEventListener('click',()=>setMode(mode));
document.querySelectorAll('[data-zoom]').forEach(btn=>btn.addEventListener('click',()=>{
  zoom=clamp(zoom*(btn.dataset.zoom==='in'?.82:1.22),.45,3.5);
  requestDraw();
}));
canvas.addEventListener('wheel',e=>{
  if(mode==='walk') return;
  e.preventDefault();
  zoom=clamp(zoom*Math.exp(Math.sign(e.deltaY)*.105),.45,3.5);
  requestDraw();
},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  if(e.button>0||drag) return;
  canvas.setPointerCapture(e.pointerId);
  canvas.focus({preventScroll:true});
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointermove',e=>{
  if(drag?.id!==e.pointerId) return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
  if(mode==='walk'){
    heading+=dx*.005;
    pitch=clamp(pitch-dy*.005,-1.38,1.38);
  } else {
    yaw-=dx*.006;
    tilt=clamp(tilt+dy*.005,.025,1.53);
    $('viewName').textContent=mode==='cut'?'俯看室內 · 隱藏屋面':'外觀 · 自由視角';
  }
  requestDraw();
});
canvas.addEventListener('lostpointercapture',e=>{if(drag?.id===e.pointerId) drag=null;});
window.addEventListener('keydown',e=>{
  const key=directions[e.key]||directions[e.key.toLowerCase()];
  if(mode!=='walk'||!key||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey) return;
  e.preventDefault();
  inputKeys.add(key);
  scheduleMovement();
});
window.addEventListener('keyup',e=>{
  inputKeys.delete(directions[e.key]||directions[e.key.toLowerCase()]);
});
window.addEventListener('blur',()=>{clearMovement();drag=null;});
document.querySelectorAll('[data-move]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    pointerKeys.set(e.pointerId,btn.dataset.move);
    scheduleMovement();
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture']){
    btn.addEventListener(type,e=>pointerKeys.delete(e.pointerId));
  }
  btn.addEventListener('click',e=>{
    if(e.detail!==0||mode!=='walk') return;
    const key=btn.dataset.move;
    const forward=Number(key==='w')-Number(key==='s');
    const right=Number(key==='d')-Number(key==='a');
    eye[0]=clamp(eye[0]+.3*(Math.sin(heading)*forward+Math.cos(heading)*right),.34,dims.width-.34);
    eye[1]=clamp(eye[1]+.3*(Math.cos(heading)*forward-Math.sin(heading)*right),.34,dims.depth-.34);
    requestDraw();
  });
});
$('measure').addEventListener('submit',e=>{
  e.preventDefault();
  const changes=Object.fromEntries(Array.from(new FormData(e.currentTarget),([key,val])=>[key,Number(val)]));
  if(changes.ridge<=changes.eave){
    $('report').textContent='屋脊高度應高於前簷。';
    return;
  }
  dims=changes;
  updateMeasurements();
  uploadGeometry();
  setMode(mode);
  $('report').textContent='已套用。門窗位置依新尺寸按比例調整。';
});

function makeGlb(model) {
  const items=Object.entries(model).filter(([key,array])=>key!=='site'&&array.length);
  const json={
    asset:{version:'2.0',generator:'倉庫現況 3D 模型'},
    scene:0,scenes:[{nodes:[]}],nodes:[],meshes:[],accessors:[],bufferViews:[],buffers:[{byteLength:0}],
    materials:[{name:'現有材質',doubleSided:true,pbrMetallicRoughness:{metallicFactor:0,roughnessFactor:.87}}]
  };
  const names={shell:'牆、門窗與鋼架',roof:'雙坡屋面',awning:'前簷'};
  const binary=new Float32Array(items.reduce((n,[,v])=>n+v.length,0));
  let offset=0;
  for(const [key,array] of items){
    const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
    for(let i=0;i<array.length;i+=9) {
      const p=[array[i],array[i+2],-array[i+1]];
      binary.set([...p,array[i+3],array[i+5],-array[i+4],...array.slice(i+6,i+9)],offset+i);
      p.forEach((v,j)=>{min[j]=Math.min(min[j],v);max[j]=Math.max(max[j],v);});
    }
    const j=json.bufferViews.length,a=json.accessors.length,k=json.nodes.length;
    json.bufferViews.push({buffer:0,byteOffset:offset*4,byteLength:array.byteLength,byteStride:36,target:34962});
    for(let t=0;t<3;t++){
      const accessor={bufferView:j,byteOffset:12*t,componentType:5126,count:array.length/9,type:'VEC3'};
      if(t===0){accessor.min=min;accessor.max=max;}
      json.accessors.push(accessor);
    }
    json.scenes[0].nodes.push(k);
    json.nodes.push({mesh:k,name:names[key]});
    json.meshes.push({name:names[key],primitives:[{attributes:{POSITION:a,NORMAL:a+1,COLOR_0:a+2},material:0}]});
    offset+=array.length;
  }
  json.buffers[0].byteLength=binary.byteLength;
  const bytes=new TextEncoder().encode(JSON.stringify(json));
  const length=(bytes.length+3)&~3;
  const glb=new ArrayBuffer(28+length+binary.byteLength);
  const view=new DataView(glb),raw=new Uint8Array(glb);
  for(const [p,n] of [[0,0x46546c67],[4,2],[8,glb.byteLength],[12,length],[16,0x4e4f534a],[20+length,binary.byteLength],[24+length,0x004e4942]]) {
    view.setUint32(p,n,true);
  }
  raw.fill(32,20,20+length);
  raw.set(bytes,20);
  raw.set(new Uint8Array(binary.buffer),28+length);
  return glb;
}
$('export').addEventListener('click',()=>{
  const blob=new Blob([makeGlb(meshData)],{type:'model/gltf-binary'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download='倉庫現況.glb';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
});

try {
  if(gl) {
    program=programForView();
    uniforms=Object.fromEntries(['eye','right','up','forward','lens'].map(key=>[key,gl.getUniformLocation(program,key)]));
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    new ResizeObserver(requestDraw).observe(canvas);
  } else {
    $('warning').hidden=false;
  }
} catch(error) {
  program=null;
  $('warning').hidden=false;
  console.error(error);
}
uploadGeometry();
updateMeasurements();
setMode('orbit');
</script>
</body>
